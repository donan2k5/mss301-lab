spring.application.name=movie-service
server.port=8082

# Spring Boot 4 uses spring.mongodb.uri
spring.mongodb.uri=mongodb://root:password@localhost:27017/cinema_movie?authSource=admin

# Create indexes declared by @Indexed and @CompoundIndex
spring.data.mongodb.auto-index-creation=true

# Log MongoTemplate queries
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG